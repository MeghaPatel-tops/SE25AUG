<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Form Example</h1>
    <form method="post" >
         <table border="1" cellpadding="10px" cellspacing="10px" align="center">
              <tr>
                <th>UserName</th>
                <td>
                    <input type="text" name="username" id="" required>
                </td>
                <th>Email</th>
                <td>
                    <input type="email" name="email" id="">
                </td>
              </tr>
              <tr>
                <th>Contact</th>
                <td>
                    <input type="text" name="contact" id="">
                </td>
                <th>Password</th>
                <td>
                    <input type="password" name="pwd" id="">
                </td>
              </tr>
              <tr>
                <th>Address</th>
                <td><textarea name="address" id=""></textarea></td>
                <th>City</th>
                <td>
                    <select name="city" id="">
                        <option value="">---select---</option>
                        <option value="Surat">Surat</option>
                        <option value="Vadodara">Vadodara</option>
                        <option value="Vapi">Vapi</option>
                    </select>
                </td>
              </tr>
              <tr>
                <th>Hobby</th>
                <td>
                    <input type="checkbox" name="hb" value="music" id="">Music
                    <input type="checkbox" name="hb" id="">Sports
                    <input type="checkbox" name="hb" id="">Dance
                </td>
                <th>Gender</th>
                <td>
                    <input type="radio" name="gender" id="">Male
                    <input type="radio" name="gender" id="">Female

                </td>
              </tr>
              <tr>
                <td><input type="submit" value="Submit"></td>
              </tr>
         </table>
    </form>
    <h2>Extra form elements</h2>
    <fieldset>
        <legend>Extra form Inputs</legend>
        <table>
            <tr>
                <th>Colors</th>
            <td><input type="color" name="" id=""></td>
            <th>Date</th>
            <td><input type="date" name="" id=""></td>
            <th>Date and Time</th>
            <td><input type="datetime-local" name="" id=""></td>
            </tr>
             <tr>
                <th>Images</th>
            <td><input type="file" name="" id=""></td>
            <th>Url</th>
            <td><input type="url" name="" id=""></td>
            <th>Number</th>
            <td><input type="number" name="" id=""></td>
            </tr>
            
        </table>
    </fieldset>
</body>
</html>
