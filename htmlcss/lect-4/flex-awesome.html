<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: gainsboro;
            padding: 50px 100px;
            display: flex;
            justify-content: space-between;
        }
        .box{
            background-color: white;
            padding: 50px 100px;
            border-radius: 20px;
            box-shadow: 5px 5px 5px gray;
            border-bottom: 5px solid rgb(70, 66, 66);
            
        }
        .box:hover{
             border: 2px solid rgb(70, 66, 66);
             border-bottom: 5px solid rgb(70, 66, 66);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">60k</div>
        <div class="box">30+</div>
        <div class="box">200M</div>
        <div class="box">7.3.1</div>
    </div>
</body>
</html>
