<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .hero{
            height: 700px;
            background-image: url(coffee.jpeg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .hero h1{
            font-size: 5em;
            color: white;
            text-shadow: 3px 3px 4px brown;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Coffee Brew</h1>
    </div>
</body>
</html>
