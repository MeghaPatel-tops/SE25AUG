<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            padding: 100px 8%;
            background-color: antiquewhite;
            display: grid;
            grid-template-columns: 200px 400px 200px;
            justify-content: space-between;
            align-items: center;
           gap:30px
        }
        .col{
            padding: 50px;
            border: 2px solid black;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="col" id="col-1">col-1</div>
        <div class="col" id="col-2">col-2</div>
        <div class="col" id="col-3">col-3</div>
        <div class="col" id="col-4">col-4</div>
        <div class="col" id="col-5">col-5</div>
        <div class="col" id="col-6">col-6</div>
        <div class="col" id="col-7">col-7</div>
        <div class="col" id="col-8">col-8</div>
        <div class="col" id="col-9">col-9</div>
    </div>
    
</body>
</html>
