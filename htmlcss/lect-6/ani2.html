<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            height: 600px;
            background-color: skyblue;
            color: white;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            animation-name: backChange;
            animation-duration: 4s;
            animation-delay: 2s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;

        }

        @keyframes backChange {
            0% {
                background-color: skyblue;
            }

            33% {
                background-color: purple;
            }

            100% {
                background-color: pink;
            }
        }

        .row {
            padding: 100px 8%;
            background-color: antiquewhite;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;

        }

        #col1{

            opacity: 0;
            /* animation-duration: 3s;
            animation: textUp linear both;
            animation-timeline: view();
            animation-range: entry 0% cover 30%; */
            animation: textUp 3s ease-out both;

        }

         #img1 {
            opacity: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            animation: imgZoom 3s ease-out both;
        } 

        @keyframes textUp {
            from {
                opacity: 0;
                transform: translateY(100px);

            }

            to {
                opacity: 1;
                transform: translateY(0px);

            }
        }

        @keyframes imgZoom {
            from {
                opacity: 0;
                transform: scale(0.5);
                
            }

            to {
                opacity: 1;
                transform: scale(1);
                
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>Latest Smartphones</h1>
    </div>
    <div class="row">
        <div class="col" id="col1">
            <h2>SmartPhone Assesst</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque aliquid doloribus est fuga ad aliquam
                laborum ipsum et reprehenderit repellendus, error voluptatibus? Modi quae, quaerat quisquam eos
                doloribus facilis quasi.</p>
            <button>Buy Now</button>
        </div>
        <div class="col">
            <img src="phone.jpeg" alt="" id="img1">
        </div>
    </div>
</body>

</html>
