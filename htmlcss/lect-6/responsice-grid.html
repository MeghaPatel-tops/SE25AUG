<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            padding: 50px;
            background-color: antiquewhite;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:20px;
        }
        .col{
            padding: 50px 0px;
            background-color: white;
            border-radius: 20px;

        }
        @media screen and (max-width:768px) {
            .row{
                 grid-template-columns: repeat(2,1fr);
            }
        }
          @media screen and (max-width:576px) {
            .row{
                 grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
    </div>
</body>
</html>
